instructions: |
  **防雷排雷（Risk Audit Strategy）**

  核心铁律：**在 A 股，活下去比赚钱重要。** 一只票技术面再完美、
  题材再性感，只要命中任一高危雷区，就是一票否决——所有看多逻辑
  归零。本策略在买入决策前**强制执行**，结果优先级高于一切。

  排雷在个股分析的前段执行。若触发"一票否决"，直接给出"回避"建议，
  不再继续看多分析。

  ## 一、四大雷区（高危，命中即否决）

  ### 雷 1：商誉减值（年报暴雷王）
  - 使用 `get_stock_info` 检查商誉占净资产比例。
  - **高危红线**：商誉 / 净资产 > 30%，且标的为高溢价并购的轻资产公司。
  - **年报窗口（次年 1-4 月）尤其危险**：商誉减值集中爆雷，
    高商誉股在业绩预告期前必须回避。
  - 典型特征：并购承诺期结束、被收购公司业绩变脸、行业景气下行。

  ### 雷 2：股权质押（平仓引爆）
  - 检查大股东股权质押比例。
  - **高危红线**：控股股东质押比例 > 70%，或股价已接近预警/平仓线。
  - 质押平仓会引发"跌停→平仓→更跌停"的死亡螺旋，
    一旦闪崩根本跑不掉。
  - 典型特征：股价连续下跌 + 高质押 = 随时可能触发平仓。

  ### 雷 3：应收账款 / 存货恶化（财务造假前兆）
  - 使用 `get_stock_info` 检查：
    - 应收账款增速 >> 营收增速（虚增收入嫌疑）
    - 经营现金流长期为负 / 远低于净利润（利润注水）
    - 存货异常堆积（滞销或虚增资产）
  - **高危红线**：应收账款 / 营收 > 50% 且持续恶化，
    或 经营现金流连续 2 年为负。
  - 这类公司是"业绩暴雷/被 ST"的高发群体。

  ### 雷 4：大股东 / 实控人减持（最直接的看空信号）
  - 使用 `search_stock_news` 搜索"减持公告"。
  - **高危红线**：控股股东或实际控制人发布大额减持计划（>1% 或 >5 亿元）。
  - **顶部减持 = 内部人都觉得贵了**，这是最可信的看空信号。
  - 特别警惕：高位借利好发布减持计划（典型套路）。

  ## 二、次级风险（降权，但不一定否决）

  ### 风险 5：监管问询 / 立案
  - 使用 `search_stock_news` 搜索"问询函/监管/立案/处罚"。
  - 收到证监会立案通知 = **一票否决**（不确定性极高）。
  - 收到交易所问询函 = 降权，需看问询内容是否涉及财务真实性。

  ### 风险 6：业绩变脸
  - 业绩预告由预增大幅下修为预减 = **一票否决**。
  - 业绩虽增长但靠非经常损益（卖资产/政府补贴）= 降权。

  ### 风险 7：解禁压力
  - 使用 `search_stock_news` 搜索"解禁"。
  - 近 1 个月内有大规模限售解禁（解禁市值 > 流通市值 20%）
    = 降权，股价承压概率高。

  ### 风险 8：概念蹭热度（伪龙头）
  - 公司主动发公告蹭热点题材，但实际业务无关 = A 杀风险。
  - 典型话术："公司涉及 XXX 概念"但收入占比为 0。

  ## 三、风险等级与处置

  | 等级 | 触发条件 | 处置 |
  |------|---------|------|
  | 🔴 **一票否决** | 商誉>30%且近年报期 / 高质押 / 立案 / 预告变脸 / 大股东减持 | **直接回避，不分析看多逻辑** |
  | 🟠 **重大风险** | 应收恶化 / 解禁压力 / 问询函 / 概念蹭热 | 评分大幅下调，仓位上限 ≤ 1 成 |
  | 🟡 **关注风险** | 现金流偏弱 / 估值过高 / 行业景气下行 | 正常分析但提示风险，仓位适度收紧 |

  ## 四、执行顺序

  本策略**必须在看多分析之前执行**：
  1. 先做防雷排雷（本策略）
  2. 若一票否决 → 直接输出"回避 + 否决原因"，结束分析
  3. 若未否决 → 继续执行大盘择时 + 个股策略，但把风险提示带入结论

  ## 评分调整

  - 🔴 一票否决：`sentiment_score` 强制设为 **≤ 20**，
    `operation_advice` = "回避"，`decision_type` = "sell/avoid"，
    在报告顶部醒目标注"⛔ 风险否决：[具体雷区]"
  - 🟠 重大风险：`sentiment_score -15`，仓位建议上限 ≤ 1 成，
    在 `risk_alerts` 中明确列出
  - 🟡 关注风险：`sentiment_score -5`，在报告中提示风险点

  在报告的"风险排查"段落，必须列出检查结果：
  - 商誉占净资产比（或"数据缺失"）
  - 质押比例（或"数据缺失"）
  - 应收账款健康度（或"数据缺失"）
  - 近期是否有减持/问询/解禁公告
  - 综合结论：通过 / 关注 / 否决（含原因）
