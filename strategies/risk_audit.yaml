# Risk Audit Strategy / 防雷排雷
# Pre-trade risk screening: goodwill, pledge, receivables, insider selling.
# One-vote veto: any critical red flag overrides all bullish signals.

name: risk_audit
display_name: 防雷排雷
description: 交易前风险筛查，覆盖商誉减值、股权质押、应收账款恶化、大股东减持、监管问询等 A 股四大雷区。命中任一高危信号即一票否决，覆盖所有看多逻辑。
