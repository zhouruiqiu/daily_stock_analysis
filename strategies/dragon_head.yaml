instructions: |
  **龙头战法（Dragon Head Strategy）**

  核心逻辑：A 股最强赚钱效应来自题材龙头。龙头=板块启动时率先涨停、
  跑赢板块、有实质催化的票。龙头会形成"连板梯队"，操作核心是
  **识别梯队高度 + 判断接力节奏 + 应对断板/炸板**。

  ## 一、龙头识别（必要条件）

  1. **板块领涨地位**：
     - 使用 `get_sector_rankings` 确认所在板块当日涨幅前列。
     - 该股在板块启动日**率先涨停**（时间早、封单大）。

  2. **相对强度**：
     - 使用 `get_realtime_quote` + `get_daily_history` 对比。
     - 真龙头在上涨日应**跑赢板块 2% 以上**，且阶段涨幅显著高于龙二龙三。

  3. **换手与动能**（关联理念7：强势股放宽）：
     - 换手率通常 > 5%（妖股可 > 10%），量比 > 1.5。
     - 龙头可放宽乖离率至 7%，但超 10% 仍需谨慎（高位接力风险）。

  4. **实质催化**：
     - 使用 `search_stock_news` 确认板块级催化剂（政策/订单/技术突破）。
     - **区分实质受益 vs 蹭概念**：蹭概念的"伪龙头"容易A杀。

  ## 二、连板梯队与介入逻辑（关键）

  连板高度是 A 股情绪温度计，不同板位介入逻辑不同：

  | 板位 | 介入逻辑 | 风险 |
  |------|---------|------|
  | **首板** | 题材启动当日打板/次日低吸。需确认板块有持续性（非一日游）。 | 板块次日闷杀 |
  | **二板** | 确认题材发酵，龙头确立。二板是相对安全的接力点。 | 三板被砸 |
  | **三板** | 龙头身份确认，进入主升。三板以上需"强者恒强"思维。 | 高位断板 |
  | **四板+** | 进入妖股阶段，纯情绪博弈。只能轻仓跟随，随时准备跑。 | 监管特停/天地板 |

  - **梯队健康度**：板块内有 2 个以上连板股 = 梯队健康，可参与；
    若只有龙头独苗连板、跟风稀少 = 接力衰竭，警惕。
  - **板块涨停家数**：≥5 家启动，≥10 家扩散，<3 家退潮。

  ## 三、一字板与秒板（不可介入信号）

  - **一字板**（开盘即涨停、全天无开口）：**散户无法介入**，不要建议追。
    一字板打开后才看是否有回封机会。
  - **秒板**（开盘几分钟内涨停）：介入难度大，封单不牢易炸板。
  - 出现一字板/秒板时，应转向**龙二龙三的卡位**机会。

  ## 四、断板与炸板应对（生存线）

  - **断板**（龙头终结连板）：通常是见顶信号。
    - 高位断板（4 板以上）→ 坚决不接力，已持仓者逢高离场。
    - 低位断板（2-3 板）→ 观察是否能反包（次日再涨停），反包失败离场。
  - **炸板**（盘中封板后被砸开）：
    - 早盘炸板回封 = 强，可观察。
    - 尾盘炸板（14:30 后）= 弱，次日大幅低开概率高，回避。
  - **天地板**（涨停到跌停）：极端风险信号，严禁参与，已持仓立即止损。

  ## 五、卡位与补涨

  - 当龙头一字板买不到时，关注**龙二、龙三**（板块内第 2、3 个涨停的票）。
  - 卡位条件：龙二龙三需在龙头封板后**快速跟上**，且换手充分（非缩量）。
  - 补涨逻辑：板块龙头涨完后，资金会找同板块低位票补涨，
    可用 `get_sector_rankings` 找板块内涨幅落后的活跃票。

  ## 六、退出纪律

  - 龙头**首阴**（连板后第一根阴线）→ 减仓信号。
  - **跌破前日开盘价**或 **5 日线**→ 止损离场，不恋战。
  - 板块退潮（涨停家数骤减、跌停出现）→ 清仓所有该板块持仓。

  ## 评分调整

  - 确认为板块龙头 + 梯队健康：`sentiment_score +15`
  - 二板接力点（相对安全）：`sentiment_score +10`
  - 首板有板块持续性确认：`sentiment_score +8`
  - 一字板/秒板（无法介入）：在 `buy_reason` 注明"一字板不可介入，关注龙二龙三"
  - 四板以上高位接力：`sentiment_score -10`（风险显著上升）
  - 断板/炸板/天地板：`sentiment_score -20`，明确提示风险
  - 在 `buy_reason` 中注明连板高度（如"三板龙头"）和介入逻辑。
