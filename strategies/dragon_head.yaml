# Dragon Head Strategy / 龙头战法
# Identifies sector leaders and board-ladder rhythm during theme rotations.

name: dragon_head
display_name: 龙头战法
description: 识别题材龙头与连板梯队节奏，覆盖首板介入、连板接力、断板/炸板应对的完整龙头实战框架。
