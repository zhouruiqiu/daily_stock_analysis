instructions: |
  **大盘择时（Market Timing Strategy）**

  核心铁律：**大盘环境优先于个股技术面。** 系统性下跌时，个股策略胜率
  会从 60% 暴跌到 30% 以下。任何买入建议都必须先回答："当前大盘环境
  允许几成仓？"——这是 A 股生存的第一要务。

  本策略**不直接选股**，而是为所有个股策略提供"仓位上限"和"环境标签"，
  必须在个股分析的最开始执行，结果写入报告顶部的"市场环境"段落。

  ## 一、大盘环境四档判定

  综合 4 个维度判断当前属于哪一档：

  ### 维度 1：指数趋势（上证/沪深300/创业板）
  - 使用 `get_daily_history` + `analyze_trend` 检查**沪深300 或 上证指数**。
  - 指数站上 MA20 且 MA20 向上 = 多头；跌破 MA20 = 空头；缠绕 = 震荡。
  - 创业板指可作风格参考（成长 vs 权重谁主导）。

  ### 维度 2：两市成交额（情绪温度计）
  - **放量进攻**：> 1.2 万亿，市场活跃，可进攻。
  - **正常**：8000 亿 ~ 1.2 万亿，中性。
  - **缩量观望**：< 7000 亿，情绪低迷，机会有限。
  - **地量**：< 5000 亿，往往接近阶段底部（但需配合其他信号确认）。

  ### 维度 3：涨跌停家数比（赚钱效应）
  - 涨停 ≥ 80 且 跌停 ≤ 20 = 强势，可重仓。
  - 涨停 30~80 = 中性。
  - 涨停 < 30 且 跌停 > 50 = 退潮/亏钱效应，必须降仓。
  - 跌停 > 100 = 恐慌，严禁开新仓。

  ### 维度 4：连板高度（情绪温度）
  - 市场最高连板 ≥ 5 板 = 情绪亢奋，主线明确。
  - 最高 3~4 板 = 情绪正常。
  - 最高 ≤ 2 板 或 龙头频繁断板 = 情绪冰点。

  ## 二、四档环境与仓位上限

  | 环境 | 判定 | 仓位上限 | 操作倾向 |
  |------|------|---------|---------|
  | 🟢 **进攻** | 指数多头 + 成交额>万亿 + 涨停>80 + 连板>4 | **6-8 成** | 积极做多，跟随主线 |
  | 🟡 **中性** | 部分维度达标，部分未达标 | **3-5 成** | 结构性操作，只做强主线 |
  | 🟠 **防守** | 指数走弱 或 涨停<30 或 跌停>50 | **1-2 成** | 防御为主，只看不买 |
  | 🔴 **空仓** | 指数破位 + 跌停>100 + 恐慌蔓延 | **0 成（空仓）** | 严禁开新仓，持币等待 |

  ## 三、环境对个股策略的约束（强制规则）

  个股层面的买入建议，必须受大盘环境约束：

  - **🔴 空仓环境**：**一律不给买入建议**。即使个股技术面完美，也只能写
    "技术面达标但大盘系统性风险高，建议空仓观望"。这是硬规则，不可覆盖。
  - **🟠 防守环境**：只允许"轻仓试探"，买入建议必须带"仓位 ≤ 2 成"。
    龙头战法、放量突破等激进策略在此环境下**降权或禁用**。
  - **🟡 中性环境**：只做最强主线个股，分散持仓不超过 3 只。
  - **🟢 进攻环境**：可正常执行所有个股策略，仓位可上调。

  ## 四、风格切换信号

  - **权重强 / 成长弱**（上证50 涨、创业板跌）：资金避险，
    适合低估值/高股息/防御板块，成长股策略降权。
  - **成长强 / 权重弱**（创业板大涨、上证50 跌）：题材活跃，
    适合龙头战法/热点题材，但警惕"抽血效应"导致指数虚高。
  - **普涨**（所有指数同步涨）：最健康，可全面做多。
  - **普跌**（所有指数同步跌）：系统性风险，立即转空仓思维。

  ## 五、政策与事件干扰

  - 使用 `search_stock_news` 检查近期是否有重大政策/监管事件。
  - 政策利空（如行业整顿、IPO 加速）会打破技术面规律，
    即使指数多头也要临时降仓。
  - 政策利好（如降准、行业振兴）可阶段性提升仓位上限一档。

  ## 评分调整（影响所有个股）

  大盘环境评分作为**全局乘数**作用于所有个股：

  - 🟢 进攻环境：个股 `sentiment_score` 可正常上调，仓位建议放宽
  - 🟡 中性环境：个股 `sentiment_score` 上调幅度 ×0.7
  - 🟠 防守环境：个股 `sentiment_score` 上调幅度 ×0.3，且必须提示仓位 ≤ 2 成
  - 🔴 空仓环境：**所有个股 `sentiment_score` 上限锁死在 30**（不支持买入），
    并在报告顶部用醒目方式标注"⚠️ 系统性风险，建议空仓"

  在报告的"市场环境"段落，必须明确写出：
  1. 当前环境档位（进攻/中性/防守/空仓）
  2. 仓位上限
  3. 4 个维度的具体数值（指数位置、成交额、涨跌停、连板高度）
  4. 对本次个股建议的约束（如"防守环境，即使技术面达标也只建议 1 成仓"）
