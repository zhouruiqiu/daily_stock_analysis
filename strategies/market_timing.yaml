# Market Timing Strategy / 大盘择时
# Determines overall market regime and position size BEFORE stock-level decisions.
# This is the most critical missing piece: all stock strategies fail when the index breaks down.

name: market_timing
display_name: 大盘择时
description: 通过指数位置、两市成交额、涨跌停家数判断市场环境，决定整体仓位水位。任何个股决策都必须先过大盘择时这一关。
