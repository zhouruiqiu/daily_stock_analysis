# 超跌反转策略
name: oversold_reversal
display_name: 超跌反转
description: 60日阶段下跌、RSI超卖且风险仍受控的修复观察候选，不代表已经确认反转
version: "1.2"
category: reversal
tags: [reversal, oversold, repair]
analysis_skills: [bottom_volume]
style:
  risk_profile: balanced
  holding_period: short_term
  execution_style: reversal
  market_regime: [oversold_repair, range_bound]
  capital_profile: medium_liquidity
  ui_badge: 反转

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 80000000
    turnover_rate_min: 1.0
    change_pct_min: -8.0
    change_pct_max: -1.0
    change_60d_min: -35.0
    change_60d_max: -8.0
    rsi_status_whitelist: [oversold]
    volatility_20d_pct_max: 55.0
    max_drawdown_20d_pct_min: -30.0
    atr_20_pct_max: 8.0
    daily_quality_score_min: 80.0
    pe_ttm_min: 0
    pe_ttm_max: 80
    pb_min: 0
    pb_max: 8.0
    price_min: 3
    price_max: 180
  factor_weights:
    reversal: 0.40
    stability: 0.20
    liquidity: 0.18
    value: 0.16
    activity: 0.06
  scoring_profile:
    reversal_ideal_change_pct: -3.5
    reversal_collapse_start_pct: -7.0
    reversal_collapse_penalty_slope: 12.0
    reversal_chase_start_pct: 0.0
    rsi_oversold_bonus: 14.0
    momentum_downside_start_pct: -4.0
    activity_ideal_volume_ratio: 1.6
    activity_ideal_turnover_rate: 3.0
  risk_profile:
    breakdown_change_pct: -8.5
    chase_change_pct: 5.0
    abnormal_volume_ratio: 5.0
    high_turnover_rate: 12.0
    weak_signal_score: 35.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      地产链: [地产, 房地产, 建材, 家居, 物业]
      消费: [白酒, 食品, 家电, 零售, 消费]
      周期: [钢铁, 煤炭, 有色, 化工]
      金融: [券商, 银行, 保险]
  scorecard_profile:
    controlled_reversal_min: 70.0
    controlled_reversal_bonus: 2.0
    volume_spike_ratio: 5.5
  ranking_hints: |
    优先关注：
    1. 60 日阶段跌幅和 RSI 超卖同时成立，且波动、回撤与 ATR 没有失控
    2. 成交额和换手仍能支撑后续修复，避免流动性塌陷
    3. 优先等待止跌或重新站回短期均线确认，不把超卖本身当作买入信号
    4. 若下跌来自基本面恶化、退市风险或持续减持，应降权或排除
  max_output: 5
